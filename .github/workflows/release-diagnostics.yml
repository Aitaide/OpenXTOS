name: OpenXTOS v1.0.2 release diagnostics

on:
  push:
    branches: ['release/v1.0.2-images']
    paths: ['.github/workflows/release-diagnostics.yml']

permissions:
  contents: read
  actions: read

jobs:
  inspect-failed-tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Read original v1.0.2 failures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          gh run view 41781547792 --repo Aitaide/OpenXTOS --log-failed > diagnostics/original-tag-failures.log
          python3 - <<'PY'
          import pathlib
          text = pathlib.Path('diagnostics/original-tag-failures.log').read_text()
          groups = {}
          for line in text.splitlines():
              fields = line.split('\t', 2)
              key = '\t'.join(fields[:2]) if len(fields) > 2 else 'other'
              groups.setdefault(key, []).append(line)
          for line in text.splitlines():
              if any(needle in line for needle in ('TrustError:', 'signature_verifier_unavailable', 'PermissionError:', 'ModuleNotFoundError:', 'ImportError:', 'libffi', 'libssl')):
                  escaped=line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f'::warning title=Exact trust failure::{escaped}')
          for key, lines in groups.items():
              needles = ('error:', 'Error ', 'FAILED', 'Traceback', 'FileNotFoundError', '##[error]', 'FAIL:', 'ModuleNotFoundError')
              hits = [i for i, line in enumerate(lines) if any(n in line for n in needles)]
              selected = set()
              for i in hits[-4:]:
                  selected.update(range(max(0, i - 2), min(len(lines), i + 18)))
              excerpt = '\n'.join(lines[i] for i in sorted(selected))[-3600:]
              escaped = excerpt.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              title = key.replace(',', ' ').replace('\r', ' ').replace('\n', ' ')[:120]
              print(f'::warning title=Original tag failure {title}::{escaped}')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-v1.0.2-tag-failure-logs
          path: diagnostics/
          if-no-files-found: error
          retention-days: 14
