name: OpenXTOS v1.0.2 release diagnostics

on:
  push:
    branches: ['release/v1.0.2-images']
    paths: ['.github/workflows/release-diagnostics.yml']

permissions:
  contents: read
  actions: read

jobs:
  retain-public-boot-success:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Retrieve exact successful public readback receipt archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          gh api repos/Aitaide/OpenXTOS/actions/runs/41835520556 > diagnostics/run.json
          gh api repos/Aitaide/OpenXTOS/actions/artifacts/13324843515 > diagnostics/artifact.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('diagnostics')
          run = json.loads((root/'run.json').read_text())
          artifact = json.loads((root/'artifact.json').read_text())
          expected = '6d4fba4ac5464d85d3ff3faa6889d86c4fb9d5fd'
          if run['id'] != 41835520556 or run['head_sha'] != expected or run['path'] != '.github/workflows/release-readback.yml' or run['conclusion'] != 'success':
              raise RuntimeError('wrong successful readback target')
          if artifact['id'] != 13324843515 or artifact['workflow_run']['id'] != run['id'] or artifact['workflow_run']['head_sha'] != expected or artifact['digest'] != 'sha256:2b6dab1249252978b17ea48a4e13cd042b637bfcbe0aa8a2ca7277a478b21cf4':
              raise RuntimeError('wrong receipt artifact')
          PY
          gh api repos/Aitaide/OpenXTOS/actions/artifacts/13324843515/zip > diagnostics/receipts.zip
          python3 - <<'PY'
          import base64, hashlib, json
          from pathlib import Path
          root = Path('diagnostics')
          data = (root/'receipts.zip').read_bytes()
          if hashlib.sha256(data).hexdigest() != '2b6dab1249252978b17ea48a4e13cd042b637bfcbe0aa8a2ca7277a478b21cf4':
              raise RuntimeError('receipt ZIP digest mismatch')
          for name in ['receipts.zip']:
              data = (root/name).read_bytes()
              if len(data) > 160000:
                  raise RuntimeError('unexpected diagnostic size')
              encoded = base64.b64encode(data).decode('ascii')
              chunks = [encoded[i:i+2000] for i in range(0,len(encoded),2000)]
              for part, chunk in enumerate(chunks,1):
                  record = {'name':name,'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data),'part':part,'parts':len(chunks),'data':chunk}
                  print('::notice title=Exact readback diagnostic::'+json.dumps(record,separators=(',',':')))

          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-v1.0.2-public-boot-success
          path: diagnostics/
          if-no-files-found: error
          retention-days: 14
