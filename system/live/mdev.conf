# XTOS device access policy. Never give an ordinary user raw disks or memory.
# Continue after the module rule so a new device also receives its access rule.
-$MODALIAS=.* 0:0 0660 @/usr/sbin/modprobe -b -q "$MODALIAS"
null|zero|full|random|urandom 0:0 0666
# Keep serial acquisition devices usable by the developer account.
tty|ptmx 0:5 0666
console|tty[0-9]+ 0:5 0600
ttyS[0-9]+|ttyUSB[0-9]+|ttyACM[0-9]+ 0:dialout 0660
# Explicit primary/render separation; render grants compute without modesetting.
dri/card[0-9]+ 0:video 0660
dri/renderD[0-9]+ 0:render 0660
video[0-9]+|media[0-9]+ 0:video 0660
# No permissive catch-all: disk, mem, input and unknown device nodes stay root-only.
.* 0:0 0600
